<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to BirdsEye</title>
<style>
body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 32rem; line-height: 1.5; }
a { color: #0a66c2; }
</style>
</head>
<body>
<h1>Returning to BirdsEye</h1>
<p>Your bank has answered. If BirdsEye does not open by itself, <a id="back" href="birdseye://bank">tap here</a>.</p>
<p>This page only hands the bank's reply to the app on your phone. It does not read, keep or send anything.</p>
<script>
var target = "birdseye://bank" + (window.location.search || "");
document.getElementById("back").setAttribute("href", target);
window.location.replace(target);
</script>
</body>
</html>
